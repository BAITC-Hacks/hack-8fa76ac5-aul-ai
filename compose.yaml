services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arna
      POSTGRES_USER: arna
      POSTGRES_PASSWORD: arna-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arna -d arna"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - arna_postgres:/var/lib/postgresql/data

  web:
    build: .
    environment:
      APP_ENV: local
      APP_SECRET_KEY: local-compose-secret-key-at-least-32-characters
      ALLOWED_HOSTS: localhost,127.0.0.1
      TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      DATABASE_URL: postgresql://arna:arna-local-only@db:5432/arna
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  arna_postgres:
